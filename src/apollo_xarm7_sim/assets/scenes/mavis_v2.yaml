# MAVIS v2 lab cell (Apollo Lab, tape-measured 2026-09-02) — digital-twin reference
# scene for the real hardware AND a sim scenario. Generated from the measurements
# below (docs/design/03-sim.md §4.3 has the arithmetic); edit the numbers there,
# not the derived values.
#
# World frame: z-up, origin on the FLOOR under the table centre. The operator
# stands at the FRONT (-Y), where the camera-only arm's rail is; +Y is toward
# the BACK (gripper arm's rail); +X is toward the RIGHT end (the end used for
# the 14.5 cm measurement).
#
# Table: 1.215 x 0.63 x 0.03 m, top surface at z = 0.735 m.
# Rails: two identical rails parallel to X, feet on the table top (arm mounting
#   plane at z = 0.735 + 0.107188 = 0.842188, mavis rail mesh), mounted the
#   same way: zero (q=0) at the RIGHT end, travel toward -X, base +X toward +Y
#   (base_quat = yaw +90 deg). Rail-to-rail spacing 39.5 cm (base lines).
#   front rail ('view', camera-only): outer edge 2 cm from the front edge  -> y0 = -0.1750
#   back rail ('grip', gripper + wrist cam): y0 = 0.2200; its far edge is
#   2.3 cm from the back edge (the "42 cm to the rail" reading is 5 mm off)
#   channel between the rails: y in [-0.1026, 0.1000] (20.3 cm wide, mavis mesh width 19.2 cm)
#   at rail zero both arms are 14.5 cm from the right edge, read literally to the
#   BASE CENTRE (x0 = 0.4625); if it was to the base edge use 0.3995, to the
#   carriage edge 0.3645. With the mavis mesh the rail's zero end then
#   overhangs the right table end by 10.3 cm (the mesh overhang is unverified).
# Obstacle: 0.16 x 0.16 x 0.26 m box IN the channel between the rails, centred in
#   the channel's free width (the front carriage protrudes 1.8 cm into it), to the
#   LEFT of the arms: +X face 29.2 cm from the right edge.
#   (The spoken "13 cm side" was superseded by 16 x 16; "flush against the table
#   edge" cannot hold inside the channel — confirm whether it touches a rail.)
# Keyframe (MJCF order, rail FIRST): rails at zero; 'grip' turned round (j1 ~ pi)
#   with the TCP 11 cm above the box top, tool down (guardrail scenario
#   'mavis_v2_box_descend' drives it down); 'view' camera 1.3 m up looking at
#   the box. Both rails at ZERO, as in the lab.
# allowed_pairs: carriages sit 24 mm above the table they are bolted to.
id: mavis_v2
description: MAVIS v2 cell - camera arm (front rail) + gripper arm (back rail) 39.5 cm apart on a 1.215
  x 0.63 table, box obstacle between them
suitable_for: [sim, twin]
arms:
- id: view
  model: xarm7_on_rail
  base_pos: [0.4625, -0.175, 0.842188]
  base_quat: [0.70710678, 0.0, 0.0, 0.70710678]
  gripper: none
  wrist_cam: true
- id: grip
  model: xarm7_on_rail
  base_pos: [0.4625, 0.22, 0.842188]
  base_quat: [0.70710678, 0.0, 0.0, 0.70710678]
  gripper: xarm
  wrist_cam: true
cameras:
- name: cam_front
  pos: [0.0, -2.0, 1.9]
  xyaxes: [1, 0, 0, 0, 0.55, 1]
  fovy: 45
- name: cam_top
  pos: [0.0, 0.0, 2.6]
  xyaxes: [1, 0, 0, 0, 1, 0]
  fovy: 42
environment:
- name: table
  type: box
  size: [0.6075, 0.315, 0.015]
  pos: [0.0, 0.0, 0.72]
  rgba: [0.62, 0.48, 0.32, 1.0]
- name: obstacle
  type: box
  size: [0.08, 0.08, 0.13]
  pos: [0.2355, 0.0075, 0.865]
  rgba: [0.75, 0.22, 0.2, 1.0]
allowed_pairs:
- [view_rail_platform, table]
- [grip_rail_platform, table]
keyframe:
  view:
    q: [0.0, -0.0666, -1.2215, -0.2794, 0.808, 0.3754, 1.9055, 0.1838]
  grip:
    q: [0.0, 2.8614, -0.6418, -0.4125, 0.7529, -0.2482, 1.3601, -0.2519]
    gripper: 1.0
