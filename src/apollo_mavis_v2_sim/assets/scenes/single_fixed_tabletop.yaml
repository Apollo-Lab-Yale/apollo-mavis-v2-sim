# One fixed (no rail) arm at the origin facing a small table.
# Railed arms need base_pos z = 0.107188 (rail bottom offset); fixed arms
# bolt straight to the floor at z = 0.
id: single_fixed_tabletop
description: one fixed xArm7 facing a small table
hidden: true  # dev/CI scene: built by id, not listed to the UI (03-sim §4)
suitable_for: [sim, twin]
arms:
  - id: arm0
    model: xarm7_fixed
    base_pos: [0.0, 0.0, 0.0]
    base_quat: [1, 0, 0, 0]
    gripper: xarm
    wrist_cam: true
cameras:
  - name: cam_front
    pos: [2.0, 0.0, 1.2]
    xyaxes: [0, 1, 0, -0.5, 0, 1]
    fovy: 45
environment:
  - name: table
    type: box
    size: [0.15, 0.25, 0.15]
    pos: [0.65, 0.0, 0.15]
    rgba: [0.6, 0.45, 0.3, 1.0]
