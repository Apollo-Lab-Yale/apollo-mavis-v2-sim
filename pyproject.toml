[project]
name = "apollo-mavis-v2-sim"
version = "0.1.0"
description = "MuJoCo simulation workcell for the apollo-mavis-v2 stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "apollo-mavis-v2-core",
    "mujoco==3.12.0",
    "mink==1.3.0",
    "numpy>=1.24,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "pupil-apriltags>=1.0.4.post11",
]

[tool.uv.sources]
apollo-mavis-v2-core = { path = "../apollo-mavis-v2-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_mavis_v2_sim"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xarm".msg = "sim must not import the xArm SDK"
"fastapi".msg = "sim must not import fastapi"
"torch".msg = "sim must not import torch"
"lerobot".msg = "sim must not import lerobot"
"cv2".msg = "sim must not import cv2"
"apollo_mavis_v2_hardware".msg = "sim must not import the hardware package"
"apollo_mavis_v2_runtime".msg = "sim must not import the runtime package"
"dora".msg = "sim must not import dora"
"pyarrow".msg = "sim must not import pyarrow"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "egl: requires a GPU/EGL-capable headless renderer",
    "perf: timing assertions (5x measured headroom); skip on loaded machines",
]
